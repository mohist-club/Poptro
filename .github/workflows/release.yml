name: Release

# 推送一个形如 v1.0.0 的 tag 就会触发。
#
# 这是默认的发布方式:用 ad-hoc 自签名(不需要任何 Apple 账号/密钥/Secrets 配置),
# 用户下载后首次打开会被 Gatekeeper 拦一下,需要自己去
# "系统设置 -> 隐私与安全性" 里点"仍要打开"授权一次,具体步骤 README 里有写清楚。
#
# 如果以后办了 Apple Developer Program 账号,想发不需要用户手动授权的正式签名版本,
# 用 release-notarized.yml 那个工作流(手动触发,需要先配置对应 Secrets)。

on:
  push:
    tags:
      - "v*"

# The default token is read-only in this repository unless explicitly granted
# release-write access.
permissions:
  contents: write

jobs:
  release:
    # Apple Translation 的 highFidelity / lowLatency strategy API 从
    # Xcode 26.4 SDK 开始可用；macos-15 默认 Xcode 16.4 无法编译。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build, package and sign
        run: ./build.sh

      - name: Package ZIP
        run: |
          ditto -c -k --keepParent Poptro.app Poptro.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Poptro.zip
            dist/Poptro.dmg
          body: |
            ## Poptro ${{ github.ref_name }}

            - 设置界面严格改用 Safari 同类的原生顶部标签导航、标准字体与紧凑间距
            - 翻译服务使用原生侧边列表、分栏视图、Form、Picker 与系统按钮
            - 通用、高级和关于页统一为 Safari 风格的标签对齐与内容宽度
            - 窗口背景改用系统原生材质；macOS 26/27 自动采用对应的液态玻璃表现
            - 修复翻译服务长说明在最小窗口尺寸下可能溢出的问题
            - 新增设置窗口渲染回归测试，固定最小尺寸为 836 × 560

            ⚠️ 这个版本是 ad-hoc 自签名,不是 Apple 官方认证开发者签名。
            首次打开会被系统拦截提示"无法验证开发者"或"已损坏",这是正常现象,不是文件真的坏了。

            **解决方法**:双击打开被拦截后,去 **系统设置 → 隐私与安全性**,往下翻能看到一条
            关于 Poptro 被阻止打开的提示,点 **仍要打开** 并确认,以后就能正常双击启动了。

            Release 同时提供 **DMG**（打开后拖入“应用程序”）和 **ZIP** 两种安装包。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
